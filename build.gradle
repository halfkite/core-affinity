plugins { id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT' apply false }
def buildTimestamp = providers.gradleProperty('buildTimestamp').orElse(
        java.time.LocalDateTime.now(java.time.ZoneId.of('Asia/Hong_Kong'))
                .format(java.time.format.DateTimeFormatter.ofPattern('yyyyMMddHHmm'))).get()
if (!(buildTimestamp ==~ /\d{12}/)) throw new GradleException('buildTimestamp must be yyyyMMddHHmm')
allprojects {
    group = 'dev.bigcore'
    version = "1.0.1+mc26.3.${buildTimestamp}"
    repositories {
        mavenCentral()
        maven { name = 'Terraformers'; url = 'https://maven.terraformersmc.com/' }
    }
}
subprojects {
    apply plugin: 'java-library'
    java { toolchain { languageVersion = JavaLanguageVersion.of(25) }; withSourcesJar() }
    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 25 }
    tasks.withType(Test).configureEach { useJUnitPlatform() }
}
